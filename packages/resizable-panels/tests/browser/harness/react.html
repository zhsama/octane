<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>react-resizable-panels differential harness</title>
		<style>
			* {
				box-sizing: border-box;
			}

			body {
				margin: 0;
				padding: 24px;
				font-family: system-ui, sans-serif;
			}

			[data-group] {
				border: 1px solid #64748b;
			}

			[data-panel] > div {
				display: grid;
				place-items: center;
				background: #e2e8f0;
			}

			[data-separator] {
				width: 8px;
				background: #334155;
			}
		</style>
	</head>
	<body>
		<div id="root"></div>
		<script type="module" src="/react.ts"></script>
	</body>
</html>
